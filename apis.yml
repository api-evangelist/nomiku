name: nomiku
description: Nomiku (Y Combinator W15, backed by Slow Ventures) was a consumer-hardware
  startup that built an affordable WiFi-connected sous-vide immersion circulator and
  the companion Tender recipe app, later pivoting to the Nomiku Meals ready-to-cook
  subscription paired with the Nomiku Smart Cooker. The company emailed customers on
  December 13, 2019 that it was discontinuing the Smart Cooker and Meals and suspending
  operations. It exposed no public developer API, SDK, or documentation surface; the
  device was controlled through a private mobile app and cloud backend. Retained in
  the API Evangelist network as a portfolio-lead identity record for historical and
  investor-graph completeness only.
